baseURL: "https://konjunktur.github.io"
title: Thorsten Hild
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

defaultContentLanguage: de
defaultContentLanguageInSubdir: false

languages:
  de:
    languageName: "Deutsch"
    weight: 1
    params:
      description: "Konjunktur-Dashboard mit aktuellen Wirtschaftsdaten für Deutschland."
      displayFullLangName: true
      label:
        text: Thorsten Hild
        icon: favicon.ico
        iconHeight: 18

  en:
    languageName: "English"
    weight: 2
    params:
      description: "Economic Dashboard with current macroeconomic indicators for Germany."
      displayFullLangName: true
      label:
        text: Thorsten Hild
        icon: favicon.ico
        iconHeight: 18

params:
  author: Thorsten Hild
  defaultTheme: light
  disableThemeToggle: true
  disableSpecial1stPost: false
  ShowBreadCrumbs: false
  ShowPostNavLinks: false
  ShowCodeCopyButtons: true
  MainSections: [""]
  displayFullLangName: true
  label:
    text: Thorsten Hild
    icon: favicon.ico
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
