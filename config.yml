baseURL: "https://github.io"
title: Thorsten Hild
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
  tag: tags

defaultContentLanguage: de

languages:
  de:
    languageName: "Deutsch"
    weight: 1
    menu:
      main:
        - name: Dashboard
          url: /dashboard/
          weight: 1
    params:
      description: "Konjunktur-Dashboard mit aktuellen Wirtschaftsdaten für Deutschland."
      displayFullLangName: true
      label:
        text: Thorsten Hild
        icon: favicon.ico
        iconHeight: 18
      profileMode:
        enabled: false

  en:
    languageName: "English"
    weight: 2
    menu:
      main:
        - name: Dashboard
          url: /en/dashboard/
          weight: 1
    params:
      description: "Economic Dashboard with current macroeconomic indicators for Germany."
      displayFullLangName: true
      label:
        text: Thorsten Hild
        icon: favicon.ico
        iconHeight: 18
      profileMode:
        enabled: false

params:
  author: Thorsten Hild
  DateFormat: January 2006
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  MainSections: [""]
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: true
  displayFullLangName: true

  assets:
    disableScrollBarStyle: true
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: Thorsten Hild
    icon: favicon.ico
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
