name: Update Beschaeftigte Verarbeitendes Gewerbe

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 18 * *'

permissions:
  contents: write

concurrency:
  group: update-main-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy matplotlib plotly
      - name: Run script
        env:
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASS: ${{ secrets.DESTATIS_PASS }}
        run: python scripts/update_beschaeftigte.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Beschaeftigte charts"
          git pull --rebase -X ours origin main
          git push
