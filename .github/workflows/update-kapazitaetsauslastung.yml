name: Update Kapazitaetsauslastung

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 28 1,4,7,10 *'

permissions:
  contents: write

concurrency:
  group: update-main-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy matplotlib plotly
      - name: Run script
        run: python scripts/update_kapazitaetsauslastung.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Kapazitaetsauslastung charts"
          git pull --rebase -X ours origin main
          git push
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy Hugo site to Pages" || true
