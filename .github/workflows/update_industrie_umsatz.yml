name: Update Industrie Umsatz

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 12,18,24 * *'

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy matplotlib plotly requests

      - name: Update Industrie Umsatz Charts
        env:
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASS: ${{ secrets.DESTATIS_PASS }}
        run: python scripts/update_industrie_umsatz.py

      - name: Commit and push generated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add static/umsatz-industrie/
          if ! git diff --staged --quiet; then
            git commit -m "Update Industrie Umsatz charts"
            git pull --rebase origin main
            git push
          fi
