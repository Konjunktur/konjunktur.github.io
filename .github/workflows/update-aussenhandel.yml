name: Test Aussenhandel Codes

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: GENESIS Struktur prüfen
        env:
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASS: ${{ secrets.DESTATIS_PASS }}
        run: python scripts/test_aussenhandel.py
