name: Update Dashboard Charts

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install -r scripts/requirements.txt

      - name: Grafiken neu berechnen
        env:
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}          git add static/dashboard/*.png static/spannungszahl/*.png static/spannungszahl/*.csv

          DESTATIS_PASS: ${{ secrets.DESTATIS_PASS }}
        run: |
          python scripts/update_charts.py
          python scripts/update_spannungszahl.py

      - name: Neue Grafiken speichern
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
                              git add static/dashboard/*.png static/spannungszahl/

          git diff --quiet && git diff --staged --quiet || (git commit -m "Update charts" && git push)

